name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Debug tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Rustdoc tests
        run: cargo test --locked --workspace --doc --all-features
      - name: Release tests
        run: cargo test --release --locked --workspace --all-targets --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features
      - name: Complete simulation
        run: cargo run --locked -p mtholdem --example simulated_hand
      - name: Package core
        run: cargo package --locked -p mental-card-core
      - name: Check downstream package contents
        # Cargo cannot build a publishable downstream tarball until the same-version
        # core crate exists in the registry. Release automation performs full package
        # verification after publishing in dependency order.
        run: |
          cargo package --list -p mtholdem
          cargo package --list -p mtholdem-testkit
